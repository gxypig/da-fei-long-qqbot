name: Import reviewed QQBot source
on:
  push:
    paths:
      - source-import.json
      - .github/workflows/import-source.yml
permissions:
  contents: write
concurrency:
  group: reviewed-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and restore reviewed source
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,pathlib,subprocess,zipfile
          source=pathlib.Path('source-import.json')
          if not source.exists():
              print('Waiting for reviewed archive')
              raise SystemExit(0)
          payload=json.loads(source.read_text())
          changed=set(subprocess.check_output(['git','diff','--name-only',payload['base_commit'],'HEAD'],text=True).splitlines())
          assert changed <= {'source-import.json','.github/workflows/import-source.yml'}, 'Remote source changed; stop to preserve it'
          blob=base64.b64decode(''.join(payload['zip_base64']),validate=True)
          assert hashlib.sha256(blob).hexdigest()==payload['sha256']
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              for item in archive.infolist():
                  target=pathlib.PurePosixPath(item.filename)
                  assert not target.is_absolute() and '..' not in target.parts and '.git' not in target.parts
                  assert not any(part in ('local','logs','backups','.venv','__pycache__','plugin_data','config') for part in target.parts)
                  assert item.file_size < 5000000
              archive.extractall('.')
          print('Reviewed source restored')
          PY
      - name: Validate and publish
        run: |
          if [ ! -f source-import.json ]; then exit 0; fi
          python tools/release_check.py
          python -m compileall -q AstrBot/data/plugins bootstrap.py manage.py
          git config user.name 'QQBot source publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm source-import.json .github/workflows/import-source.yml
          git add --all
          git commit -m 'Fix live conversation dashboard and group reply starvation; unify sharp character style and publish pending chat improvements'
          git push origin HEAD:main
