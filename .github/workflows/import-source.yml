name: Import reviewed QQBot source
on:
  push:
    paths:
      - source-import.json
      - .github/workflows/import-source.yml
permissions:
  contents: write
concurrency:
  group: reviewed-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Verify archive and restore source files
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, zipfile
          path=pathlib.Path('source-import.json')
          if not path.exists():
              print('Waiting for the reviewed source archive')
              raise SystemExit(0)
          payload=json.loads(path.read_text())
          encoded=payload['zip_base64']
          blob=base64.b64decode(''.join(encoded) if isinstance(encoded,list) else encoded,validate=True)
          assert hashlib.sha256(blob).hexdigest()==payload['sha256'], 'Archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              for item in archive.infolist():
                  target=pathlib.PurePosixPath(item.filename)
                  assert not target.is_absolute() and '..' not in target.parts and '.git' not in target.parts
                  assert not any(part in ('local','logs','backups','.venv','__pycache__') for part in target.parts)
                  assert item.file_size < 5000000
              archive.extractall('.')
          # Final user correction: ordinary replies must not add quote segments.
          delta=base64.b64decode('',validate=True)
          assert hashlib.sha256(delta).hexdigest()=='8fde59dabdb4bdc18e3d29999ea4696c4eee9508b77d9582deef66518ad1903a'
          with zipfile.ZipFile(io.BytesIO(delta)) as corrections:
              for item in corrections.infolist():
                  target=pathlib.PurePosixPath(item.filename)
                  assert not target.is_absolute() and '..' not in target.parts
                  assert item.filename in ['DEPLOYMENT.md', 'README.md', 'SOURCE_MANIFEST.json', 'tests/test_sent_routing_bili.py', 'AstrBot/data/plugins/astrbot_plugin_proactive_agent/route_guard.py']
              corrections.extractall('.')
          print('Restored audited source files')
          PY
      - name: Validate and publish the source tree
        run: |
          if [ ! -f source-import.json ]; then exit 0; fi
          python tools/release_check.py
          python -m compileall -q AstrBot/data/plugins bootstrap.py manage.py
          git config user.name 'QQBot source publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm source-import.json .github/workflows/import-source.yml
          git add --all
          git commit -m 'Remember proactive messages, guard recipients and add anonymous Bilibili sharing'
          git push origin HEAD:main
