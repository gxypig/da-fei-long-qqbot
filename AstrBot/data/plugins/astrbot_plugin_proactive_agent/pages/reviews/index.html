<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审阅记录</title><link rel="stylesheet" href="./style.css"></head><body>
<header><small>大肥龙 · 运行</small><h1>审阅记录</h1><p>看清原稿如何修改，以及最后实际发出了什么。查看不会重新审阅或重发</p></header>
<main><form id="filters"><label>开始时间<input id="start" type="datetime-local"></label><label>结束时间（留空至现在）<input id="end" type="datetime-local"></label><label>会话<input id="origin" placeholder="完整会话标识，可留空" maxlength="300"></label><label>关键词<input id="keyword" type="search" maxlength="200"></label><label>结果<select id="result"><option value="ai_rewritten">AI 改写</option><option value="passed">原稿通过</option><option value="local_guard">身份表达保护</option><option value="format_only">仅格式调整</option><option value="failed">未通过、失败或取消</option><option value="all">全部</option></select></label><button>查询 / 刷新</button></form>
<p id="notice" role="status">正在读取记录</p><p id="coverage"></p><details><summary>记录保留与健康状态</summary><p id="health"></p><p>保留时间与数量可在运行的高级设置中修改。旧版未留存完整对照，不按时间推断原稿</p></details>
<div class="table-scroll"><table><thead><tr><th>时间与会话</th><th>原稿摘要</th><th>改稿摘要</th><th>审阅与发送</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev">上一页</button><span id="page">第 1 页</span><button id="next">下一页</button></div></main>
<dialog id="detail"><div class="drawer-head"><h2>原稿与实发对照</h2><button id="close">关闭</button></div><p id="meta"></p><p id="detail-notice" role="status"></p><details><summary>触发消息与必要上下文</summary><pre id="context"></pre></details><div class="actions"><button id="diff">只看差异</button><button id="copy-original">复制原稿</button><button id="copy-approved">复制改稿</button><button id="copy-both">复制对照</button></div><div class="compare"><section><h3>审阅前原稿</h3><pre id="original"></pre></section><section><h3>审阅通过稿</h3><pre id="approved"></pre></section></div><section><h3>实际发送内容与状态</h3><div id="sent"></div></section><details><summary>展开各轮修改</summary><div id="rounds"></div></details></dialog>
<script src="/api/plugin/page/bridge-sdk.js"></script><script src="./app.js?v=round10-20261104"></script></body></html>
