<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话管理</title><link rel="stylesheet" href="../persona/style.css"></head><body><main>
<header><div><p class="eyebrow">大肥龙 · 群聊与好友</p><h1>会话管理</h1><p>静默时继续记录和学习，但不发送文字、语音、图片或提醒。恢复后不会补发旧任务</p></div></header>
<div id="notice" role="status">正在连接…</div>
<section><div class="bar"><select id="kind" aria-label="群或好友"><option value="GroupMessage">群聊</option><option value="FriendMessage">好友</option></select><input id="query" type="search" placeholder="搜索名称或号码" aria-label="搜索会话"><label><input id="only" type="checkbox">只看静默</label><button id="refresh">刷新</button></div><div id="rows"></div><div class="bar"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
<dialog id="edit"><form method="dialog"><h2 id="target"></h2><p>这项操作立即独立保存，不需要再点总设置的保存按钮</p><label>静默时长<select id="duration"><option value="1800">30 分钟</option><option value="3600">1 小时</option><option value="21600">6 小时</option><option value="86400">24 小时</option><option value="forever">无限期</option><option value="custom">自定义截止时间</option></select></label><input id="until" type="datetime-local" hidden><p id="edit-status" role="status"></p><button value="cancel">取消</button><button type="button" id="apply" class="primary">保存静默</button></form></dialog>
</main><script src="/api/plugin/page/bridge-sdk.js"></script><script src="./app.js"></script></body></html>
